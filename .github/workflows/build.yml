# grobyq v4.0 — Windows build pipeline.
# Builds the WPF app on a real Windows runner (WPF cannot be built on Linux), then protects, signs and publishes it.
#
# Stages, in order:
#   1. build      — dotnet build/publish the WPF app (Release, win-x64, self-contained=false; .NET 8 Desktop runtime).
#   2. test       — run the logic tests (mask/topology/engine) so a broken build never ships.
#   3. obfuscate  — ConfuserEx2 over the published exe: anti-decompile (rename + string encrypt + control flow) and
#                   anti-tamper / anti-debug. This is the "защита от кражи/реверса" — raises the bar vs dnSpy/ILSpy.
#   4. sign       — Authenticode signtool on the obfuscated exe (ONLY if the signing secret is configured). This proves
#                   the binary is yours and unmodified; it does NOT hide the code (that is stage 3's job).
#   5. package    — Inno Setup compiles setup.exe (installs to Program Files, shortcuts, uninstaller). Also signed.
#   6. publish    — upload artifacts; on a version tag, attach them to a GitHub Release and emit update manifest
#                   (version + sha256) that the in-app auto-updater reads. The updater verifies the Authenticode
#                   signature of the downloaded exe BEFORE replacing — so a tampered/MITM'd download is rejected.
#
# Secrets you set in the repo (Settings → Secrets and variables → Actions) when ready:
#   SIGN_PFX_BASE64   — base64 of your code-signing .pfx   (stage 4/5; without it, those stages are skipped, build still runs)
#   SIGN_PFX_PASSWORD — the .pfx password

name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed to create a Release on a tag

env:
  APP_CSPROJ: src-wpf/grobyq.csproj
  CONFUSER_VERSION: "1.6.0"      # ConfuserEx2 community release

jobs:
  build:
    runs-on: windows-latest
    env:
      # secrets can't be used in a step `if:` directly — map to a job env first, then gate on it.
      HAS_CERT: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ---- 1. build / publish the WPF app ----
      - name: Publish (Release, win-x64)
        shell: pwsh
        run: |
          dotnet publish $env:APP_CSPROJ -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=false -o publish
          if (-not (Test-Path publish/grobyq.exe)) { throw "grobyq.exe not produced" }

      # ---- 2. tests (a red test must fail the build) ----
      - name: Test
        shell: pwsh
        run: |
          if (Test-Path tests) { dotnet test -c Release } else { Write-Host "no tests project yet — skipping" }

      # ---- 3. obfuscate (ConfuserEx2) ----
      # .NET 8: grobyq.exe is the native apphost, the managed code is grobyq.dll - that is what gets protected. The
      # crproj template gets the runner's .NET 8 shared framework folders as probe paths. Output: obf\grobyq.dll, then
      # protected\ = publish\ with the protected dll. continue-on-error: a failed obfuscation never blocks a build;
      # the smoke test below decides which build ships.
      - name: Obfuscate (ConfuserEx2)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $url = "https://github.com/mkaring/ConfuserEx/releases/download/v$env:CONFUSER_VERSION/ConfuserEx-CLI.zip"
          try { Invoke-WebRequest $url -OutFile confuser.zip -ErrorAction Stop } catch { Write-Host "::warning::ConfuserEx download failed: $($_.Exception.Message)"; throw }
          Expand-Archive confuser.zip -DestinationPath confuser -Force
          $cli = Get-ChildItem confuser -Recurse -Filter Confuser.CLI.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cli) { Write-Host "::warning::Confuser.CLI.exe not found in the zip: $((Get-ChildItem confuser -Recurse | Select-Object -First 15 -ExpandProperty Name) -join ', ')"; throw "no CLI" }
          $root = Split-Path (Get-Command dotnet).Source
          function Latest($name) {
            Get-ChildItem (Join-Path $root "shared\$name") -Directory | Where-Object { $_.Name -like '8.0.*' } |
              Sort-Object { [version]$_.Name } | Select-Object -Last 1 -ExpandProperty FullName
          }
          $core = Latest 'Microsoft.NETCore.App'; $desk = Latest 'Microsoft.WindowsDesktop.App'
          Write-Host "probe paths: $core | $desk"
          (Get-Content build\Confuser.crproj -Raw).Replace('@@NETCORE@@', $core).Replace('@@DESKTOP@@', $desk) |
            Set-Content build\Confuser.gen.crproj -Encoding utf8
          $out = & $cli -n .\build\Confuser.gen.crproj 2>&1 | Out-String
          Write-Host $out
          if (-not (Test-Path obf\grobyq.dll)) {
            # surface the reason as annotations (the job log is not always at hand)
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'ERROR|Exception|Failed|failed|cannot|Cannot|resolve' } | Select-Object -First 8
            foreach ($l in $lines) { Write-Host "::warning::confuser: $($l.Trim())" }
            throw "obfuscation produced no grobyq.dll"
          }
          Write-Host "::notice::ConfuserEx protected grobyq.dll ($((Get-Item obf\grobyq.dll).Length) bytes)"
          Copy-Item publish protected -Recurse -Force
          Copy-Item obf\grobyq.dll protected\grobyq.dll -Force

      # ---- 3b. smoke test: grobyq.exe /selftest (headless: resources, languages, topology, presets, every page) ----
      # The protected build ships only if the unprotected one passes AND it passes too; otherwise the unprotected build
      # is packaged and a warning says why (bring-up: a selftest failure never blocks the artifact).
      - name: Smoke test (selftest)
        shell: pwsh
        run: |
          function Smoke($dir) {
            $exe = Join-Path $dir 'grobyq.exe'
            if (-not (Test-Path $exe)) { return 99 }
            $log = Join-Path $env:TEMP 'grobyq-selftest.txt'
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '/selftest' -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "selftest timed out in $dir"; return 98 }
            Write-Host "---- selftest $dir (exit $($p.ExitCode)) ----"
            if (Test-Path $log) {
              Get-Content $log | ForEach-Object { Write-Host $_ }
              Get-Content $log | Where-Object { $_ -like 'FAIL*' -or $_ -like 'PASS*' -or $_ -like '*jit*' } | Select-Object -First 8 | ForEach-Object { Write-Host "::notice::selftest $dir : $_" }
            } else { Write-Host "::warning::selftest $dir wrote no log (exit $($p.ExitCode))" }
            return [int]$p.ExitCode
          }
          $plain = Smoke 'publish'
          $src = 'publish'
          if ($plain -ne 0) { Write-Host "::warning::the unprotected build fails its selftest ($plain) - packaging it unprotected, check the log above" }
          elseif (Test-Path protected\grobyq.dll) {
            $prot = Smoke 'protected'
            if ($prot -eq 0) { $src = 'protected'; Write-Host "protected build passed: packaging it" }
            else { Write-Host "::warning::protected build failed its selftest ($prot) - packaging the unprotected build" }
          } else { Write-Host "::warning::no protected build - packaging the unprotected build" }
          "PKG_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- 4. sign (only when the cert secret is configured; the build still runs without it) ----
      - name: Sign exe + dll (Authenticode)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGN_PFX_BASE64 }}
          PFX_PW:  ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f cert.pfx /p $env:PFX_PW /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 "$env:PKG_SRC/grobyq.exe" "$env:PKG_SRC/grobyq.dll"

      # ---- 5. package (Inno Setup) ----
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # absolute paths: Inno resolves relative SourceDir/OutputDir against the .iss folder (build\), not the repo root
          $src = "$PWD\$env:PKG_SRC"
          $out = "$PWD\dist"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DSrcDir=$src /DOutDir=$out build\grobyq.iss
          if (-not (Test-Path dist/grobyq-setup.exe)) { throw "installer not produced" }

      # ---- 6. publish artifacts + update manifest ----
      - name: Update manifest (version + sha256)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v'); if (-not $ver) { $ver = "0.0.0-dev" }
          $sha = (Get-FileHash dist/grobyq-setup.exe -Algorithm SHA256).Hash.ToLower()
          @{ version = $ver; file = "grobyq-setup.exe"; sha256 = $sha } | ConvertTo-Json | Out-File dist/version.json -Encoding utf8
          Get-Content dist/version.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grobyq-${{ github.ref_name }}
          path: |
            dist/grobyq-setup.exe
            dist/version.json

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/grobyq-setup.exe
            dist/version.json
